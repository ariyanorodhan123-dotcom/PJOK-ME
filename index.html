<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJOK VIP Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">

        <div class="logo">
            <h1>PJOK</h1>
            <h2>VIP LOGIN</h2>
        </div>

        <form id="loginForm">

            <div class="input-box">
                <span>📱</span>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Mobile Number"
                    required
                >
            </div>

            <button type="submit" class="main-btn">
                LOGIN
            </button>

        </form>

        <p class="demo-text">Demo website — no information is stored.</p>

    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const mobile = document.getElementById("mobile").value.trim();

    if (mobile === "") {
        alert("Please enter your mobile number.");
        return;
    }

    // Demo only — number is not sent anywhere
    sessionStorage.setItem("demoMobile", mobile);

    window.location.href = "verify.html";
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">

        <div class="verify-icon">✓</div>

        <h2>Verification</h2>

        <p class="description">
            Your number has been received for this demo.
            Click verify to continue.
        </p>

        <div class="demo-box">
            <strong>Demo Verification</strong>
            <br>
            No OTP or password is required.
        </div>

        <button class="main-btn" onclick="verifyDemo()">
            VERIFY
        </button>

    </div>
</div>

<script>
function verifyDemo() {
    window.location.href = "success.html";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card success-card">

        <div class="success-icon">✓</div>

        <h2>Success!</h2>

        <p class="description">
            Your demo verification was completed successfully.
        </p>

        <button class="main-btn" onclick="location.href='index.html'">
            BACK TO LOGIN
        </button>

    </div>
</div>

</body>
</html>
